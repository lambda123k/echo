<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Écho</title>
<meta name="description" content="Écho transforme tes cours en fiches réflexes, en jeux et en points.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Écho">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fff'/%3E%3Crect x='24' y='20' width='52' height='14' rx='7' fill='%2312b886'/%3E%3Crect x='24' y='43' width='40' height='14' rx='7' fill='%23ffb800'/%3E%3Crect x='24' y='66' width='52' height='14' rx='7' fill='%23ff5e62'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f7f9; --card:#ffffff; --ink:#15171c; --muted:#6b7280; --line:#e6e8ec;
  --blue:#0a8a5f; --onblue:#ffffff; --yellow:#ffc21a; --onyellow:#15171c; --red:#e5484d; --green:#12b886;
  --soft:#f0f2f5; --shadow:0 1px 2px rgba(21,23,28,.04),0 4px 16px -8px rgba(21,23,28,.12);
  --title:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  --body:"Manrope",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --paper:#0f1115; --card:#181b21; --ink:#eceef2; --muted:#9097a3; --line:#262a33;
    --blue:#3ee6b0; --onblue:#0f1115; --yellow:#ffc21a; --red:#ff6b6e; --green:#3ee6b0; --soft:#20242c;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.8); color-scheme:dark;
  }
}
[data-theme="tableau"]{--paper:#1d2b24;--card:#2a3d33;--ink:#f3f0e6;--muted:#b8c4b9;--line:#3d5448;--blue:#f2d45c;--onblue:#1d2b24;--yellow:#f7f0c6;--red:#ff8a80;--green:#9be7a8;--soft:#33483d;color-scheme:dark}
[data-theme="ocean"]{--paper:#d6edf3;--card:#f7fdff;--ink:#0d2b3a;--muted:#4f6f7f;--line:#b7dbe6;--blue:#0a7ea4;--onblue:#fff;--yellow:#ffd166;--red:#ef476f;--green:#06a77d;--soft:#e6f5f9}
[data-theme="sakura"]{--paper:#fbe7ec;--card:#fffafb;--ink:#3a1f2b;--muted:#8a6272;--line:#f3cbd6;--blue:#c2185b;--onblue:#fff;--yellow:#ffe0ef;--red:#d6336c;--green:#2f9e44;--soft:#fdf0f3}
[data-theme="nuit"]{--paper:#0d1030;--card:#171b45;--ink:#eef0ff;--muted:#a3a8d6;--line:#2a2f68;--blue:#ffcf5c;--onblue:#0d1030;--yellow:#ffcf5c;--red:#ff7a8a;--green:#6ee7b7;--soft:#1f2456;color-scheme:dark}
[data-theme="neon"]{--paper:#0b0b14;--card:#15152a;--ink:#f5f5ff;--muted:#a0a0c8;--line:#2b2b52;--blue:#ff3fd2;--onblue:#0b0b14;--yellow:#39ff9e;--red:#ff4d6d;--green:#39ff9e;--soft:#1d1d3a;color-scheme:dark}
[data-theme="nuit"] body{background-image:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 10%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fff5 50%,transparent 51%);background-size:180px 180px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--title);line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}
mark{background:var(--yellow);color:var(--onyellow);padding:0 .15em;border-radius:3px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
.top .wrap{padding-top:10px;padding-bottom:10px}
.top-row{display:flex;align-items:center;gap:8px}
.rank{font-family:var(--title);font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.pill.pts{background:var(--yellow);color:var(--onyellow);box-shadow:none}
.pet{display:inline-flex;line-height:1}
.i{display:block;flex:none}
.lvl{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.rk .lvl{background:var(--soft);color:var(--ink)}.rk.cur .lvl{background:var(--blue);color:var(--onblue)}
.frz{display:inline-flex;align-items:center;gap:2px;color:var(--blue);margin-left:4px}
.pill .i,.btn .i{display:inline-block;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.endic{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--blue) 12%,var(--card));color:var(--blue);display:grid;place-items:center;margin:0 auto}
.tab .i{margin:0 auto}
.back{display:grid;place-items:center}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .4s}
.goal{font-size:12px;color:var(--muted);margin-top:5px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:660px;width:100%}
.tab{flex:1;border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);font-weight:700}
.tab span{height:26px;display:grid;place-items:center}
.tab[aria-selected="true"]{color:var(--blue)}


section.view{padding:18px 0 24px}
.h{font-size:28px;font-weight:800;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}

/* bristol card */
.bristol{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px}

/* hero */
.hero{margin-top:4px;position:relative}
.hero .stack{display:none}
.hero .bristol{background:none;box-shadow:none;padding:6px 0 0}
.hero h1{font-size:clamp(30px,8.5vw,40px);font-weight:800;line-height:1.08;margin:0 0 10px;max-width:14ch;letter-spacing:-.035em}
.hero p{margin:0 0 20px;color:var(--muted);font-size:16px;max-width:34ch}
.add3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.add3 button{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:16px 4px 14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}

.add3 button:first-child{background:var(--blue);color:var(--onblue);box-shadow:none}
.add3 button:active{transform:translateY(1px)}

/* deck list */
.decks{display:grid;gap:12px;margin-top:28px}
.deck{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.deck{position:relative}.deck .bar{margin-top:10px}.deck h3{padding-right:40px}.deck .edit{position:absolute;top:12px;right:12px;width:36px;height:36px;padding:0;background:var(--soft)}
.deck h3{font-size:18px;font-weight:700}
.meta{font-size:14px;color:var(--muted);margin:2px 0 8px}
.minibars{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--muted)}
.minibars .bar{margin-top:3px;height:5px}
.minibars .m i{background:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;background:var(--soft);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.pri{background:var(--blue);color:var(--onblue)}
.btn.yel{background:var(--yellow);color:var(--onyellow);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);background:transparent;box-shadow:inset 0 0 0 1.5px var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:14px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:18px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;border:0;box-shadow:var(--shadow);background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:3px;min-height:128px}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--blue);display:grid;place-items:center;margin-bottom:8px}
.tile.lock .ic{color:var(--muted)}
.tile b{font-family:var(--title);font-size:16px;font-weight:700}
.tile small{color:var(--muted);font-size:13px;line-height:1.35;flex:1}
.tile .bar{height:5px;margin-top:6px}
.tile .bar i{background:var(--green)}
.tile.lock{opacity:.5}
.tile.daily{grid-column:1/-1;background:var(--yellow);color:var(--onyellow);box-shadow:none;min-height:0;flex-direction:row;align-items:center;gap:12px}
.tile.daily small{color:inherit;opacity:.8}
.tile.daily .ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.55);color:var(--onyellow);margin:0}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.add3 button{font-size:13px}}

/* screen overlay */
.screen{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.scr-head{position:sticky;top:0;z-index:2;background:var(--paper);padding-top:env(safe-area-inset-top)}
.scr-head .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.back{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:18px;box-shadow:var(--shadow);flex:none}
.scr-head h2{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr-body{padding-top:16px}

/* editor */
label.lab{display:block;font-weight:700;margin:12px 0 6px}
input.txt,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;outline:none}
input.txt:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:240px;resize:vertical;line-height:1.5;font-size:16px}
.srcrow{display:flex;gap:8px;flex-wrap:wrap}
.help{font-size:14px;color:var(--muted);background:var(--soft);border-radius:14px;padding:4px 12px;margin-top:10px}
.help summary{cursor:pointer;font-weight:700;padding:6px 0;color:var(--ink)}
.help code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:13px}
.ocr{margin-top:10px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 12px;font-size:14px}
.preview{margin-top:14px}
.preview h3{font-size:16px;margin-bottom:6px}
.pv{font-size:14px;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;display:flex;gap:8px;width:100%;text-align:left;line-height:1.45}
.pv.off{opacity:.35;text-decoration:line-through}
.pv mark{background:color-mix(in srgb,var(--yellow) 55%,transparent)}
.pv .tag{flex:none;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--soft);color:var(--muted);height:fit-content}
.pv .tag.p{background:color-mix(in srgb,var(--blue) 14%,var(--card));color:var(--blue)}
.pv .tag.s{background:var(--yellow);color:var(--onyellow)}

/* lesson */
.lesson{min-height:300px;display:flex;flex-direction:column}
.lesson .sec{font-size:13px;color:var(--muted);margin-bottom:14px}
.lesson .term{font-family:var(--title);font-size:28px;font-weight:800;line-height:1.15;margin:0 0 12px;letter-spacing:-.03em}
.lesson .def{font-size:18px;line-height:1.6;margin:0}
.lesson .count{margin-top:auto;padding-top:18px;font-size:14px;color:var(--muted)}
.nav2{display:flex;gap:8px;margin-top:14px}
.nav2 .btn{flex:1;padding:14px;border-radius:14px}

/* fiche */
.fiche{padding:22px}
.fiche h2{font-size:24px;margin-bottom:2px}
.fiche .date{font-size:13px;color:var(--muted);margin-bottom:6px}
.fiche h3{font-size:15px;margin:18px 0 6px;color:var(--blue)}
.fiche ul{margin:0;padding-left:18px}
.fiche li{line-height:1.5;margin:0 0 8px}
.fiche li b{font-weight:700}

/* flashcard */
.flip{perspective:1200px;margin:6px 0 12px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.on{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;overflow:auto}
.fc .verso{transform:rotateY(180deg)}
.fc .face .w{font-family:var(--title);font-size:26px;font-weight:800;line-height:1.2}
.fc .face .d{font-size:18px;line-height:1.5}
.fc .hint{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:var(--muted)}

/* game */
.gtop{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:8px}
.gtop .combo{margin-left:auto;white-space:nowrap;flex:none;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft)}
.gtop .combo.hot{background:var(--red);color:#fff}
.q{padding-bottom:18px}
.q-lead{margin:0 0 6px;color:var(--muted);font-size:14px}
.q-main{margin:0;font-size:20px;line-height:1.4;font-weight:700;letter-spacing:-.01em}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--blue);height:1.1em;vertical-align:-2px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.4;font-weight:600}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--card))}
.opt.ko{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card))}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.vf .opts{grid-template-columns:1fr 1fr}
.vf .opt{text-align:center;font-size:18px}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;background:var(--soft);font-size:16px}
.fb .res{font-weight:800;font-family:var(--title);font-size:18px}
.fb .res.ok{color:var(--green)} .fb .res.ko{color:var(--red)}
.fb .gain{float:right;background:var(--yellow);color:var(--onyellow);border-radius:999px;padding:0 8px;font-weight:800;font-size:14px}
.tools{display:flex;gap:8px;margin-top:10px}
.end{text-align:center;padding:20px 0}
.end .big{font-family:var(--title);font-size:56px;font-weight:800;line-height:1;letter-spacing:-.04em}
.end p{color:var(--muted)}
.asso{display:grid;grid-template-columns:1fr 1.35fr;gap:8px;margin-top:10px}
.asso .col{display:grid;gap:8px;align-content:start}
.asso .opt{padding:10px;font-size:14px;font-weight:700}
.asso .opt.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.asso .opt.done{opacity:.4;border-color:var(--green)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* bureau */
.block{margin-top:30px}
.block>h2{font-size:18px;margin-bottom:12px}
.ranks{display:grid;gap:6px}
.rk{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--card);font-size:14px;box-shadow:var(--shadow)}

.rk .n{font-weight:700;flex:1}
.rk.lockd{opacity:.45}
.rk.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px}
.item .e{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--blue);display:grid;place-items:center;margin-bottom:6px}
.item b{font-size:15px}
.item small{color:var(--muted);font-size:13px;line-height:1.35;flex:1}
.item .btn{padding:6px 10px;font-size:14px;margin-top:6px}
.sw{display:flex;gap:4px;height:22px;margin-bottom:4px}
.sw i{flex:1;border-radius:999px;border:1px solid #0001}
.achs{display:grid;gap:6px}
.ach{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.ach .e{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--yellow) 35%,var(--card));color:var(--ink);display:grid;place-items:center;flex:none}
.ach.no .e{background:var(--soft);color:var(--muted)}
.ach div{flex:1}
.ach small{color:var(--muted);display:block}
.ach.no{opacity:.5}
details.rules{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:4px 14px;font-size:15px}
details.rules summary{font-weight:700;cursor:pointer;padding:8px 0}
details.rules ul{padding-left:18px;margin:4px 0 12px}
details.rules li{margin:3px 0}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 20px -8px #0008;animation:tin .25s;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.screen~.toasts{bottom:calc(20px + env(safe-area-inset-bottom))}



.eyebrow{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 10px}
.active{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px 16px 12px}
.a-top{display:flex;align-items:flex-start;gap:12px;padding:0 4px 14px}
.a-top>div:first-child{flex:1;min-width:0}
.a-top h2{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.a-top .meta{margin:6px 0 0}
.active .edit{position:static;flex:none;width:36px;height:36px;padding:0;background:var(--soft)}
.ring{--p:0;flex:none;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.ring small{font-size:9px;font-weight:700;margin-left:1px}
.ring span{display:flex;align-items:baseline;justify-content:center;padding-top:13px}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.steps li+li{border-top:1px solid var(--line)}
.step{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 4px;text-align:left}
.s-ic{width:36px;height:36px;border-radius:11px;background:var(--soft);color:var(--blue);display:grid;place-items:center;flex:none}
.step.ok .s-ic{background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green)}
.step.next .s-ic{background:var(--blue);color:var(--onblue)}
.s-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.s-tx b{font-size:15px;font-weight:700}
.s-tx small{font-size:13px;color:var(--muted)}
.s-pc{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.step.next .s-pc{color:var(--blue)}
.cur{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:10px 10px 10px 14px;margin:10px 0 14px}
.cur b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.cur-l{display:none}
.block .decks{margin-top:0}
.ring span{padding-top:0;align-items:center}
.cur .btn{padding:7px 12px;font-size:13px}

.cgrade{background:var(--soft);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.cg-row{display:flex;align-items:center;gap:8px;font-size:15px}
.cg-row b{flex:1}
.cg-p{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cgrade .bar{margin-top:10px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.cgrade small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.cur-p{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.arena{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px;background:var(--ink);color:var(--paper);box-shadow:none}
.tile.arena small{color:inherit;opacity:.7}
.tile.arena .ic{width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--paper) 14%,transparent);color:var(--yellow);margin:0}
.purse{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pbtn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pbtn b{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pbtn small{color:var(--muted);font-size:13px}
.betbar{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.betbar .bl{font-size:14px;color:var(--muted);margin-right:auto}
.bet{min-width:48px;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bet[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bet:disabled{opacity:.35;cursor:not-allowed}
.bet[aria-pressed="true"]:disabled{opacity:1}
.bal{font-size:13px;color:var(--muted);margin:0 0 12px;text-align:right}
.gtop .combo.up{background:color-mix(in srgb,var(--green) 18%,var(--card));color:var(--green)}
.gtop .combo.down{background:color-mix(in srgb,var(--red) 16%,var(--card));color:var(--red)}
.fb .gain.neg{background:var(--red);color:#fff}
.conds{display:grid;gap:8px;margin-top:16px}
.cond{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;font-size:14px}
.cond b{flex:1;font-weight:600}
.cond>span:last-child{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.cond.ok .s-ic{background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green)}
.dipl{background:#fff;color:#15171c;border-radius:6px;padding:10px;box-shadow:var(--shadow)}
.dipl-in{border:1.5px solid #15171c;outline:1px solid #15171c;outline-offset:-7px;padding:34px 20px 22px;text-align:center}
.d-seal{width:56px;height:56px;border-radius:50%;background:#0a8a5f;color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.d-k{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0}
.d-to{font-size:13px;color:#6b7280;margin:10px 0 2px}
.d-name{font-size:24px;font-weight:700;margin:0;border-bottom:1px solid #e6e8ec;display:inline-block;padding:0 16px 4px;min-width:60%}
.d-course{font-size:19px;font-weight:700;margin:0}
.d-foot{display:flex;justify-content:space-between;gap:8px;margin-top:26px;font-size:13px;font-weight:700}
.d-foot small{display:block;font-weight:500;color:#6b7280;font-size:11px}
@media print{#printzone .dipl{box-shadow:none;max-width:680px;margin:40px auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body.printing>*{display:none!important}
  body.printing #printzone{display:block!important}
  body{background:#fff;padding:0}
  #printzone .bristol{box-shadow:none}
}

  const prose=para=>{
    for(let s of splitSentences(para)){
      s=s.replace(/\s+/g,' ').trim();
      acronyms(s).forEach(([a,e])=>add(a,e,'pair','sigle'));
      if(s.length<20||s.length>320) { if(s.length>=10&&s.length<20&&/\d/.test(s)) add(s,'','fact','auto'); continue }
      let hit=false;
      for(const [rx,a,b] of DEF_RX){const m=s.match(rx);if(m&&okTerm(m[a])&&m[b].length>=8){add(cleanTerm(m[a]),capFirst(cleanDef(m[b])),'pair','def');hit=true;break}}

    }
  };

    if(/[:：]\s*$/.test(l)&&l.length<=60){sec=l.replace(/\s*[:：]\s*$/,'').trim();continue}
    let best=null;
    for(const s of SEPS){const i=l.indexOf(s);if(i>0&&l.slice(i+s.length).trim()&&(!best||i<best.i))best={i,len:s.length}}

  items.forEach(it=>new Set(words(it.t+' '+it.d).map(w=>w.toLowerCase())).forEach(w=>df[w]=(df[w]||0)+1));

const pairs=d=>d.items.filter(i=>i.type==='pair');

function build(deck,game,r=Math.random){

    if(uniqBy(P,x=>game==='qd'?x.t:x.d).length<3) return out;
    for(const it of P){
      const f=game==='qd'?x=>x.t:x=>x.d;
      const others=pick(uniqBy(P.filter(o=>f(o).toLowerCase()!==f(it).toLowerCase()),f),3,r);
      if(others.length<2) continue;
      const opts=shuffle([f(it),...others.map(f)],r);
      out.push({key:`${deck.id}:${game}:${it.k}`,
        html:game==='qd'?`<p class="q-lead">Quel terme correspond à cette définition&nbsp;?</p><p class="q-main">${esc(it.d)}</p>`
                        :`<p class="q-lead">Que veut dire…</p><p class="q-main">${esc(it.t)}</p>`,
        o:opts,a:opts.indexOf(f(it)),why:`<b>${esc(it.t)}</b> : ${esc(it.d)}`});
    }
  }
  if(game==='vf'){
    if(P.length<2) return out;
    for(const it of P){
      const others=P.filter(o=>o.d.toLowerCase()!==it.d.toLowerCase());
      const truth=!others.length||r()<.5; const o=truth?null:others[Math.floor(r()*others.length)];

        html:`<p class="q-lead">Vrai ou faux&nbsp;?</p><p class="q-main">${esc(it.t)} : ${esc(truth?it.d:o.d)}</p>`,
        o:['Vrai','Faux'],a:truth?0:1,
        why:truth?`Oui, c'est bien ça. <b>${esc(it.t)}</b> : ${esc(it.d)}`:`Non. <b>${esc(it.t)}</b> : ${esc(it.d)}. La définition proposée correspond à « ${esc(o.t)} ».`});

function insertText(t){const ta=$('#edText');ta.value=(ta.value.trim()?ta.value.replace(/\s*$/,'')+'\n':'')+t.trim();ta.dispatchEvent(new Event('input'))}
function joinLines(txt){
  const out=[];
  for(const l of txt.split(/\r?\n/)){
    const s=l.trim();
    if(!s){out.push('');continue}
    const prev=out.length?out[out.length-1]:'';
    if(prev&&!/[.!?:;]$/.test(prev)&&!/^#/.test(prev)&&/^[a-zà-ÿ(,]/.test(s)&&!BUL.test(s)) out[out.length-1]=prev+' '+s;
    else out.push(s);
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n');
}
function saveDeck(deck,title,text,ex=[]){
  const items=parseText(text).filter(i=>!ex.includes(i.k));
  if(deck){deck.title=title;deck.text=text;deck.items=items;deck.ex=ex}
  else{const d={id:'d'+Date.now().toString(36),title,text,items,ex,created:today()};S.decks.unshift(d);S.cur=d.id;toast('Cours enregistré !')}
  save();refresh();
}

/* ---------- lecture de photo (Tesseract.js, dans le navigateur) ---------- */
let tessP=null;
function loadTess(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessP) tessP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>{tessP=null;rej(new Error('net'))};document.head.appendChild(s)});
  return tessP;
}
function downscale(file,max=2000){
  return new Promise((res)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c)};
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url;
  });
}
$('#photoIn').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  const box=$('#ocrBox'); if(!box) return; box.hidden=false;
  const say=h=>box.innerHTML=h;
  try{
    say('Chargement du lecteur de texte… (la première fois, il télécharge le français : quelques Mo)');
    await loadTess();
    let n=0;
    for(const f of files){
      n++;
      const img=await downscale(f);
      const r=await Tesseract.recognize(img,'fra',{logger:m=>{if(m.status==='recognizing text')say(`Lecture de la photo ${n}/${files.length}… ${Math.round(m.progress*100)} %<div class="bar"><i style="width:${m.progress*100}%"></i></div>`)}});
      const txt=(r.data.text||'').replace(/[ \t]+\n/g,'\n').trim();
      if(txt) insertText(txt);
    }
    S.photo=true; save(); checkAch();
    say('Texte ajouté. <b>Relis-le et corrige les erreurs</b>, puis mets une notion par ligne. Le bouton « Recoller les lignes coupées » aide à réparer les phrases coupées.');
  }catch(err){
    say(err.message==='net'?'Impossible de charger le lecteur de texte : il faut une connexion internet la première fois. Tu peux aussi utiliser « Texte en direct » de l\'iPhone : sur la photo, sélectionne le texte, copie-le, puis colle-le ici.':'La photo n\'a pas pu être lue. Essaie avec une photo plus nette, bien éclairée et prise bien à plat.');
  }
};

function scoreAnswer(ok,key,mode){
  let pts=0;
  if(ok){
    combo++; if(combo>S.maxCombo)S.maxCombo=combo;
    let base;
    if(!S.seen[key]){base=S.miss[key]?3:5;S.seen[key]=1;delete S.miss[key]}
    else{if(S.revDay!==today()){S.revDay=today();S.revPts=0}base=S.revPts<40?1:0;if(base)S.revPts++}
    if(mode==='daily')base=5;
    const m=combo>=8?2:combo>=5?1.5:combo>=3?1.2:1;
    pts=Math.round(base*m); if(pts&&S.loupe>0){pts*=2;S.loupe--}
    if([3,5,8,10].includes(combo)) toast(`Combo ×${combo}`);
    if(pts) gain(pts,true,key.split(':')[0]); else save();
  }else{combo=0;if(!S.seen[key])S.miss[key]=1;save()}
  return pts;
}
function runGame(title,qs,mode,replay){
  combo=0; let i=0,good=0,earned=0,answered=false;
  openScreen(title,'<div id="gz"></div>');
  const z=$('#gz');
  const draw=()=>{
    if(i>=qs.length) return end();
    const q=qs[i];answered=false;
    z.innerHTML=`<div class="gtop"><span>Question ${i+1}/${qs.length}</span><span class="combo${combo>=3?' hot':''}">×${combo} combo</span></div>
      <div class="bristol q${q.vf?' vf':''}">${q.html}<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-i="${j}">${esc(o)}</button>`).join('')}</div></div>
      ${!q.vf&&q.o.length>2?`<div class="tools"><button class="btn" id="joker" ${S.jokers?'':'disabled'}>${ic('half',16)} 50/50 · ${S.jokers}</button>${S.loupe?`<span class="pill">${ic('zoom',15)} Loupe · ${S.loupe}</span>`:''}</div>`:''}
      <div id="fb"></div>`;
    $$('.opt',z).forEach(b=>b.onclick=()=>choose(+b.dataset.i));
    const jk=$('#joker');
    if(jk) jk.onclick=()=>{if(answered||!S.jokers)return;S.jokers--;save();renderTop();
      const wrong=$$('.opt',z).filter(b=>+b.dataset.i!==q.a&&!b.classList.contains('gone'));
      shuffle(wrong).slice(0,Math.max(0,wrong.length-1)).forEach(b=>{b.classList.add('gone');b.disabled=true});jk.disabled=true;jk.innerHTML=`${ic('half',16)} 50/50 · ${S.jokers}`};
  };
  const choose=j=>{
    if(answered)return;answered=true;const q=qs[i],ok=j===q.a;
    $$('.opt',z).forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k===q.a)b.classList.add('ok');else if(k===j)b.classList.add('ko')});
    const pts=scoreAnswer(ok,q.key,mode); if(ok){good++;earned+=pts}
    const jk=$('#joker');if(jk)jk.disabled=true;
    $('.combo',z).textContent=`×${combo} combo`;$('.combo',z).classList.toggle('hot',combo>=3);
    $('#fb').innerHTML=`<div class="fb">${pts?`<span class="gain">+${pts}</span>`:''}<div class="res ${ok?'ok':'ko'}">${ok?'Juste !':'Raté'}</div><div>${q.why}</div></div>
      <button class="btn pri big" id="nx" style="margin-top:10px">${i+1<qs.length?'Question suivante':'Voir le résultat'}</button>`;
    $('#nx').onclick=()=>{i++;draw();$('#screen').scrollTop=0};$('#nx').focus({preventScroll:true});
  };
  const end=()=>{
    let bonus='';
    if(mode==='daily'){S.daily={day:today(),deck:S.cur,score:good,n:qs.length};if(good===qs.length){S.dailyPerfect++;gain(30,true,S.cur);earned+=30;bonus='<p><b>Sans-faute : +30 pts bonus !</b></p>'}save();}
    const pet=PETS.find(p=>p[0]===S.pet);
    z.innerHTML=`<div class="end"><div class="big">${good}/${qs.length}</div><h2 style="margin-top:8px">${good===qs.length?'Parfait !':good>=qs.length/2?'Bien joué':'On continue'}</h2>
      <p>+${earned} pts gagnés · ${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</p>${bonus}
      <div class="row" style="justify-content:center">${replay?'<button class="btn pri" id="again">Rejouer</button>':''}<button class="btn" id="out">Retour</button></div></div>`;
    if(replay)$('#again').onclick=()=>{closeScreen();replay()};
    $('#out').onclick=()=>closeScreen();
  };
  draw();
}
function runArena(deck){
  const qs=pick(['qd','qt','vf','trou'].flatMap(g=>build(deck,g)),8);
  let purse=null,i=0,net=0,wins=0,bet=0,answered=false;
  openScreen('Quitte ou double','<div id="gz"></div>');const z=$('#gz');
  const bal=()=>purse==='g'?S.xp:(deck.bank||0);
  const setBal=v=>{v=Math.max(0,v);if(purse==='g')S.xp=v;else deck.bank=v;save();renderTop()};
  const start=()=>{
    z.innerHTML=`<div class="endic">${ic('coin',28,1.6)}</div>
      <h2 style="text-align:center;margin:14px 0 6px">Quitte ou double</h2>
      <p class="sub" style="text-align:center">8 questions. Avant chaque réponse, choisis ta mise : 0, 10, 25 ou 50. Juste, tu gagnes la mise. Faux, tu la perds. Ce que tu gagnes ici ne compte pas pour les grades.</p>
      <p class="lab" style="text-align:center">Avec quels points veux-tu jouer ?</p>
      <div class="purse"><button class="pbtn" data-p="g"><b>${S.xp}</b><small>Points globaux</small></button><button class="pbtn" data-p="c"><b>${deck.bank||0}</b><small>Points du cours</small></button></div>`;
    $$('.pbtn',z).forEach(b=>b.onclick=()=>{purse=b.dataset.p;if(bal()<10)toast('Solde faible : tu ne pourras miser que 0');draw()});
  };
  const draw=()=>{
    if(i>=qs.length)return end();
    const q=qs[i];answered=false;if(bet>bal())bet=0;
    z.innerHTML=`<div class="gtop"><span>Question ${i+1}/${qs.length}</span><span class="combo${net>0?' up':net<0?' down':''}">${net>0?'+':''}${net} pts</span></div>
      <div class="betbar"><span class="bl">Ta mise</span>${[0,10,25,50].map(m=>`<button class="bet" data-m="${m}" aria-pressed="${m===bet}" ${m>bal()?'disabled':''}>${m}</button>`).join('')}</div>
      <p class="bal">${purse==='g'?'Points globaux':'Points du cours'} : <b>${bal()}</b></p>
      <div class="bristol q${q.vf?' vf':''}">${q.html}<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-i="${j}">${esc(o)}</button>`).join('')}</div></div><div id="fb"></div>`;
    $$('.bet',z).forEach(b=>b.onclick=()=>{if(answered)return;bet=+b.dataset.m;$$('.bet',z).forEach(x=>x.setAttribute('aria-pressed',x===b))});
    $$('.opt',z).forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  };
  const choose=j=>{
    if(answered)return;answered=true;const q=qs[i],ok=j===q.a,dv=ok?bet:-bet;
    $$('.opt',z).forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k===q.a)b.classList.add('ok');else if(k===j)b.classList.add('ko')});
    $$('.bet',z).forEach(b=>b.disabled=true);
    setBal(bal()+dv);net+=dv;if(ok)wins++;if(ok&&bet>=50){S.bigBet++;save()}
    $('.bal b',z).textContent=bal();
    $('#fb').innerHTML=`<div class="fb">${bet?`<span class="gain${dv<0?' neg':''}">${dv>0?'+':''}${dv}</span>`:''}<div class="res ${ok?'ok':'ko'}">${ok?'Juste !':'Raté'}</div><div>${q.why}</div></div>
      <button class="btn pri big" id="nx" style="margin-top:10px">${i+1<qs.length?'Question suivante':'Voir le bilan'}</button>`;
    $('#nx').onclick=()=>{i++;draw();$('#screen').scrollTop=0};
  };
  const end=()=>{
    checkAch();
    z.innerHTML=`<div class="end"><div class="big">${net>0?'+':''}${net}</div><h2 style="margin-top:8px">${net>0?'Bien misé !':net<0?'La chance tournera':'À l\'équilibre'}</h2>
      <p>${wins}/${qs.length} bonnes réponses · ${purse==='g'?'points globaux':'points du cours'} : ${bal()}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" id="again">Rejouer</button><button class="btn" id="out">Retour</button></div></div>`;
    $('#again').onclick=()=>runArena(deck);$('#out').onclick=()=>closeScreen();
  };
  start();
}
function runAsso(deck){
  combo=0;
  const P=shuffle(uniqBy(pairs(deck),x=>x.t)),rounds=[];
  for(let k=0;k<P.length;k+=4)rounds.push(P.slice(k,k+4));
  if(rounds.length>1&&rounds[rounds.length-1].length<3){const last=rounds.pop();rounds[rounds.length-1].push(...last)}
  let r=0,earned=0,errors=0;
  openScreen('Association','<div id="az"></div>');
  const z=$('#az');
  const draw=()=>{
    if(r>=rounds.length){z.innerHTML=`<div class="end"><div class="endic">${ic('link',28,1.6)}</div><h2 style="margin-top:8px">${errors?`Terminé avec ${errors} erreur${errors>1?'s':''}`:'Sans faute !'}</h2><p>+${earned} pts gagnés</p><div class="row" style="justify-content:center"><button class="btn pri" id="again">Rejouer</button><button class="btn" id="out">Retour</button></div></div>`;
      $('#again').onclick=()=>runAsso(deck);$('#out').onclick=()=>closeScreen();return}
    const R=rounds[r],L=shuffle(R),Rt=shuffle(R);let sel=null,left=R.length;
    z.innerHTML=`<div class="gtop"><span>Série ${r+1}/${rounds.length} · touche un terme puis sa définition</span><span class="combo${combo>=3?' hot':''}">×${combo} combo</span></div>
      <div class="asso"><div class="col">${L.map(p=>`<button class="opt" data-t="${p.k}">${esc(p.t)}</button>`).join('')}</div>
      <div class="col">${Rt.map(p=>`<button class="opt" data-d="${p.k}">${esc(p.d)}</button>`).join('')}</div></div><div id="afb"></div>`;
    $$('[data-t]',z).forEach(b=>b.onclick=()=>{if(b.disabled)return;$$('[data-t]',z).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.t});
    $$('[data-d]',z).forEach(b=>b.onclick=()=>{
      if(b.disabled)return; if(!sel){toast('Touche d\'abord un terme à gauche');return}
      const tb=$(`[data-t="${sel}"]`,z),key=`${deck.id}:asso:${sel}`;
      if(b.dataset.d===sel){const p=scoreAnswer(true,key,'practice');earned+=p;[tb,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done','ok');x.disabled=true});sel=null;left--;
        if(left===0){$('#afb').innerHTML=`<button class="btn pri big" id="nx" style="margin-top:14px">${r+1<rounds.length?'Série suivante':'Voir le résultat'}</button>`;$('#nx').onclick=()=>{r++;draw()}}}
      else{scoreAnswer(false,key,'practice');errors++;b.classList.add('ko','shake');setTimeout(()=>b.classList.remove('ko','shake'),400)}
      const c=$('.combo',z);c.textContent=`×${combo} combo`;c.classList.toggle('hot',combo>=3);
    });
  };
  draw();
}

function shopItem(e,n,desc,p,id,full){return `<div class="item"><div class="e">${ic(e,22,1.7)}</div><b>${n}</b><small>${desc}</small><button class="btn yel" data-buy="${id}" data-p="${p}" ${S.xp<p||full?'disabled':''}>${full?'Maximum atteint':'Acheter · '+p}</button></div>`}
$('#importIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.decks))throw 0;if(confirm('Remplacer tes données actuelles par cette sauvegarde ?')){S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);save();refresh();toast('Sauvegarde importée')}}catch(err){toast('Ce fichier n\'est pas une sauvegarde Écho')}};r.readAsText(f)};

renderTop(); show('cours'); checkAch();
